<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout Youtube</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

    <header class="navbar">
        <img class="logo" src="assets/img/Left.png" alt="logo do YouTube">
        <img class="pesquisa" src="assets/img/pesquisa.png" alt="barra de pesquisa do YouTube">
        <img class="perfil" src="assets/img/Right.png" alt="menu de usuário">
    </header>

    <div class="main-layout">

        <!-- Menu Lateral -->
        <aside class="sidebar">
            <img src="assets/img/Sidebar.png" alt="Menu de navegação lateral">
        </aside>

        <!-- Área dos Vídeos -->
        <main class="content">

            <div class="videos-grid">

                <div class="container-video">
                    <img class="Video-1" src="assets/img/Video-1.png" alt="sugestão de vídeo 1">
                </div>
                <div class="container-video">
                    <img class="Video-2" src="assets/img/Video-2.png" alt="sugestão de vídeo 2">
                </div>
                <div class="container-video">
                    <img class="Video-3" src="assets/img/Video-3.png" alt="sugestão de vídeo 3">
                </div>
                <div class="container-video">
                    <img class="Video-4" src="assets/img/Video-4.png" alt="sugestão de vídeo 4">
                </div>
                <div class="container-video">
                    <img class="Video-5" src="assets/img/Video-5.png" alt="sugestão de vídeo 5">
                </div>
                <div class="container-video">
                    <img class="Video-6" src="assets/img/Video-1.png" alt="sugestão de vídeo 6">
                </div>
                <div class="container-video">
                    <img class="Video-7" src="assets/img/Video-2.png" alt="sugestão de vídeo 7">
                </div>
                <div class="container-video">
                    <img class="Video-8" src="assets/img/Video-3.png" alt="sugestão de vídeo 8">
                </div>
                <div class="container-video">
                    <img class="Video-9" src="assets/img/Video-4.png" alt="sugestão de vídeo 9">
                </div>
                <div class="container-video">
                    <img class="Video-10" src="assets/img/Video-5.png" alt="sugestão de vídeo 10">
                </div>
                <div class="container-video">
                    <img class="Video-11" src="assets/img/Video-1.png" alt="sugestão de vídeo 11">
                </div>
                <div class="container-video">
                    <img class="Video-12" src="assets/img/Video-2.png" alt="sugestão de vídeo 12">
                </div>
            </div>
        </main>

    </div>
</body>

</html>
